<!DOCTYPE html>
<html>
<head>
    <title>Search Medicine</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

<h2>Search Medicine</h2>

<form method="POST">

<label>Enter Medicine ID or Name</label>
<input type="text" name="keyword" required>

<button type="submit">Search</button>

</form>

<p>{{ message }}</p>

{% if medicine %}

<h3>Medicine Found</h3>

<table>
<tr><th>Medicine ID</th><td>{{ medicine.medicine_id }}</td></tr>
<tr><th>Name</th><td>{{ medicine.name }}</td></tr>
<tr><th>Category</th><td>{{ medicine.category }}</td></tr>
<tr><th>Price</th><td>₹{{ medicine.price }}</td></tr>
<tr><th>Stock</th><td>{{ medicine.stock }}</td></tr>
<tr><th>Manufacturer</th><td>{{ medicine.manufacturer }}</td></tr>
</table>

{% endif %}

<a href="/">Back to Home</a>

</div>

</body>
</html>
