<!DOCTYPE html>
<html>
<head>
    <title>View Medicines</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

<h2>All Medicines</h2>

<table>
<tr>
    <th>Medicine ID</th>
    <th>Name</th>
    <th>Category</th>
    <th>Price</th>
    <th>Stock</th>
    <th>Manufacturer</th>
</tr>

{% for m in medicines %}
<tr>
    <td>{{ m.medicine_id }}</td>
    <td>{{ m.name }}</td>
    <td>{{ m.category }}</td>
    <td>₹{{ m.price }}</td>
    <td>{{ m.stock }}</td>
    <td>{{ m.manufacturer }}</td>
</tr>
{% endfor %}

</table>

<a href="/">Back to Home</a>

</div>

</body>
</html>
